name: Build and Deploy Qt Application

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-deploy:
    name: Build on ${{ matrix.os }}
    runs-size: large
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos

    steps:
    # 1. Check out the source code from your repository
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Install Ninja build system
    - name: Install Ninja
      uses: aseprite/get-ninja@main

    # 3. Install the correct Qt6 environment automatically
    - name: Install Qt6
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.5.3' # Change this if your local version is different (e.g., 6.6.0)
        host: '${{ matrix.platform }}'
        target: 'desktop'
        arch: ${{ matrix.platform == 'windows' && 'win64_mingw' || '' }}
        install-deps: 'true'

    # 4. Set up C++ Compiler (GCC for Windows / Clang for macOS)
    - name: Set up Compiler (Windows)
      if: matrix.platform == 'windows'
      uses: egor-tensin/setup-gcc@v1
      with:
        version: 12.2.0
        platform: x64

    # 5. Configure and build using CMake and Ninja
    - name: Build Application
      run: |
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
        cmake --build build

    # 6. Run Deployment Tool (Windows)
    - name: Deploy Binaries (Windows)
      if: matrix.platform == 'windows'
      shell: bash
      run: |
        mkdir dist_windows
        cp build/YourAppName.exe dist_windows/
        # Use the windeployqt tool added to your PATH by the install-qt-action
        windeployqt --dir dist_windows dist_windows/YourAppName.exe
      # ⚠️ IMPORTANT: Replace "YourAppName.exe" above with your actual executable target name!

    # 7. Run Deployment Tool (macOS)
    - name: Deploy Binaries (macOS)
      if: matrix.platform == 'macos'
      run: |
        mkdir dist_macos
        # macdeployqt creates a self-contained app bundle structure and wraps it in a DMG
        macdeployqt build/YourAppName.app -dmg
        cp build/YourAppName.dmg dist_macos/
      # ⚠️ IMPORTANT: Replace "YourAppName.app" and "YourAppName.dmg" with your actual targets!

    # 8. Upload the finished packages as downloadable GitHub artifacts
    - name: Upload Artifacts (Windows)
      if: matrix.platform == 'windows'
      uses: actions/upload-artifact@v4
      with:
        name: YourAppName-Windows
        path: dist_windows/

    - name: Upload Artifacts (macOS)
      if: matrix.platform == 'macos'
      uses: actions/upload-artifact@v4
      with:
        name: YourAppName-macOS
        path: dist_macos/
