name: Build and Deploy Qt Application

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-deploy:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: mac

    steps:
    # 1. Check out the source code
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Install Ninja build system
    - name: Install Ninja
      uses: aseprite/get-ninja@main

    # 3. Install the correct Qt6 environment
    - name: Install Qt6
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.5.3' 
        host: '${{ matrix.platform }}'
        target: 'desktop'
        arch: ${{ matrix.platform == 'windows' && 'win64_mingw' || '' }}
        install-deps: 'true'

    # 4. Set up C++ Compiler (GCC for Windows)
    - name: Set up Compiler (Windows)
      if: matrix.platform == 'windows'
      uses: egor-tensin/setup-gcc@v1
      with:
        version: 12.2.0
        platform: x64

    # 5. Configure and build using CMake and Ninja
    - name: Build Application
      run: |
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
        cmake --build build

    # 6. Run Deployment Tool (Windows)
    - name: Deploy Binaries (Windows)
      if: matrix.platform == 'windows'
      shell: bash
      run: |
        mkdir dist_windows
        cp build/test.exe dist_windows/
        windeployqt --dir dist_windows dist_windows/test.exe

    # 7. Run Deployment Tool (macOS)
    - name: Deploy Binaries (macOS)
      if: matrix.platform == 'mac'
      run: |
        mkdir dist_macos
        macdeployqt build/test.app -dmg
        cp build/test.dmg dist_macos/

    # 8. Upload the finished packages as downloadable GitHub artifacts
    - name: Upload Artifacts (Windows)
      if: matrix.platform == 'windows'
      uses: actions/upload-artifact@v4
      with:
        name: test-Windows
        path: dist_windows/

    - name: Upload Artifacts (macOS)
      if: matrix.platform == 'mac'
      uses: actions/upload-artifact@v4
      with:
        name: test-macOS
        path: dist_macos/
